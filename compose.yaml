name: dearyou

x-app-env: &app-env
  APP_URL: http://localhost:${APP_FORWARD_PORT:-8088}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: dearyou
  DB_USERNAME: dearyou
  DB_PASSWORD: dearyou_local
  # Keep host-machine .env DB_* (port 3307 etc.) from breaking containers.
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      <<: *app-env
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_FORWARD_PORT:-8088}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      <<: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "${VITE_FORWARD_PORT:-5174}:5173"
    environment:
      VITE_HMR_PORT: ${VITE_FORWARD_PORT:-5174}
    volumes:
      - ./backend:/var/www/html
      - dearyou-node-modules:/var/www/html/node_modules
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      <<: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dearyou
      MYSQL_USER: dearyou
      MYSQL_PASSWORD: dearyou_local
      MYSQL_ROOT_PASSWORD: dearyou_root_local
    ports:
      # Optional host access to Docker MySQL (does not replace your old 3307 DB)
      - "${MYSQL_FORWARD_PORT:-3308}:3306"
    volumes:
      - dearyou-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udearyou", "-pdearyou_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dearyou-mysql:
  dearyou-node-modules:
