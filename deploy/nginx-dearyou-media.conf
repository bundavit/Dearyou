# Legacy static-file template only. Do not use for private letter attachments.
# Phase 5 needs an authorized DNS-only media endpoint before app proxy rollout.
# Optional production media hostname: DNS-only (grey cloud), same origin server.
# Install only after media.dearyous.app resolves to the server and its certificate
# exists. For initial issuance enable only the HTTP block and use the ACME webroot.
# Never include the Cloudflare real-IP snippet or add PHP/FastCGI to this server.
server {
    listen 80;
    listen [::]:80;
    server_name media.dearyous.app;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-dearyou-media;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://media.dearyous.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media.dearyous.app;

    # Serve only the Laravel public disk, never backend/public or storage/app/private.
    root /var/www/dearyou/backend/storage/app/public;
    ssl_certificate /etc/letsencrypt/live/media.dearyous.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.dearyous.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/dearyou-media.access.log;
    error_log /var/log/nginx/dearyou-media.error.log warn;

    autoindex off;
    expires off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Cache-Control "private, no-store" always;
    add_header Access-Control-Allow-Origin "https://dearyous.app" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;

    # Regex checks run before /storage/. Do not use ^~ on that location.
    location ~ /\. {
        deny all;
    }

    location ~* \.(?:php[0-9]?|phtml|phar)(?:[./]|$) {
        return 404;
    }

    # Deny historical static URLs; attachments now require Laravel access checks.
    location ~* ^/storage/(?:letters|avatars|memories)(?:/|$) {
        return 404;
    }

    location /storage/ {
        # HEAD is implicitly allowed with GET; no uploads or preflight.
        limit_except GET {
            deny all;
        }
        # Preserve Laravel's /storage/<path> URLs while serving the disk root.
        rewrite ^/storage/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # No arbitrary public-disk root URL, directory listing or app fallback.
    location / {
        return 404;
    }
}
