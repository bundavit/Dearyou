# Install only after the staging certificate and password file exist.
# For initial certificate issuance, enable only the first (HTTP) server block.
# ACME webroot: /var/www/letsencrypt-dearyou-staging
server {
    listen 80;
    listen [::]:80;
    server_name staging.dearyous.app;

    access_log /var/log/nginx/dearyou-staging.access.log;
    error_log /var/log/nginx/dearyou-staging.error.log warn;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # This is the only content served over HTTP; it is outside the app checkout.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-dearyou-staging;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://staging.dearyous.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.dearyous.app;
    root /var/www/dearyou-staging/backend/public;

    ssl_certificate /etc/letsencrypt/live/staging.dearyous.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.dearyous.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/dearyou-staging.access.log;
    error_log /var/log/nginx/dearyou-staging.error.log warn;

    index index.php;
    charset utf-8;
    client_max_body_size 128M;

    # All HTTPS locations inherit this gate, including PHP, assets and uploads.
    auth_basic "DearYou staging";
    auth_basic_user_file /etc/nginx/.htpasswd-dearyou-staging;

    # Keep add_header directives at server scope so every location inherits them.
    # Do not add a location-level add_header without repeating this full set.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;
    expires off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Run only Laravel's front controller; never execute PHP from uploads.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header Expires;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:$|/) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|mp4|webm|mp3|wav|ogg|m4a|aac|svg|ico|woff|woff2)$ {
        try_files $uri =404;
    }
}
