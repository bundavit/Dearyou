# HTTP bootstrap template. Merge the locations and headers below into the existing
# production HTTPS server after Certbot setup; preserve its certificates/redirects.
server {
    listen 80;
    listen [::]:80;
    server_name dearyous.app www.dearyous.app;
    root /var/www/dearyou/backend/public;

    # Install the reviewed snippet first, then enable in the HTTPS server too.
    # include snippets/dearyou-cloudflare-realip.conf;

    index index.php;
    charset utf-8;
    # Below Cloudflare Free's 100 MB whole-request limit, including multipart data.
    client_max_body_size 95m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "private, no-store" always;
    expires off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Run only Laravel's front controller; never execute a PHP upload or pathinfo.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header Expires;
        fastcgi_hide_header X-Powered-By;
    }

    # These regex guards must precede asset regex locations. Do not replace the
    # storage/asset prefixes below with ^~, which would skip these checks.
    location ~* \.(?:php[0-9]?|phtml|phar)(?:[./]|$) {
        return 404;
    }

    # Only root ACME challenge tokens may bypass dotfile blocking.
    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # Deny historical static URLs; attachments now require Laravel access checks.
    location ~* ^/storage/(?:letters|avatars|memories)(?:/|$) {
        return 404;
    }

    location = /storage {
        return 404;
    }

    location /storage/ {
        try_files $uri =404;
    }

    # Cache only reviewed public assets. Missing files never reach Laravel.
    # Local add_header directives replace inherited ones, so repeat all headers.
    location ~* ^/(?:assets|build|vendor)/.+\.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|eot)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800, no-transform";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /build/ {
        try_files $uri =404;
    }

    location /vendor/ {
        try_files $uri =404;
    }
}
